[package]
name    = "aegis-vault"
version = "4.0.0"
edition = "2021"

[[bin]]
name = "aegis-vault"
path = "src/main.rs"

[dependencies]
# ── Cryptography ──────────────────────────────────────────────────────────────
aes-gcm  = { version = "0.10", features = ["stream"] }
argon2   = "0.5"
hkdf     = "0.12"
hmac     = "0.12"
sha2     = "0.10"
subtle   = "2.5"          # constant-time comparison
rand     = { version = "0.8", features = ["getrandom"] }

# ── Secure memory ─────────────────────────────────────────────────────────────
zeroize  = { version = "1.7", features = ["derive"] }
secrecy  = "0.8"

# ── Nonce registry ────────────────────────────────────────────────────────────
dashmap  = "5.5"          # lock-free concurrent HashMap for nonce dedup

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio    = { version = "1", features = ["full"] }

# ── GUI ───────────────────────────────────────────────────────────────────────
iced     = { version = "0.12", features = ["tokio"] }

# ── Platform file locking ─────────────────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
libc     = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Foundation",
]}

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"   # eliminates unwinding attack surface
